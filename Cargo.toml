[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/locomotion",
    "crates/graph",
    "crates/scene",
    "crates/state",
    "crates/dialogue",
    "crates/inventory",
    "crates/save",
    "crates/assets",
    "crates/render2d",
    "crates/audio",
    "crates/input",
    "crates/ui",
    "crates/scripting",
    "crates/cutscene",
    "crates/localization",
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["John D. Pope"]
repository = "https://github.com/johndpope/adventure-engine"
homepage = "https://github.com/johndpope/adventure-engine"
publish = false

[workspace.dependencies]
# Crates we own
adventure-core = { path = "crates/core" }
adventure-locomotion = { path = "crates/locomotion" }
adventure-graph = { path = "crates/graph" }
adventure-scene = { path = "crates/scene" }
adventure-state = { path = "crates/state" }
adventure-dialogue = { path = "crates/dialogue" }
adventure-inventory = { path = "crates/inventory" }
adventure-save = { path = "crates/save" }
adventure-assets = { path = "crates/assets" }
adventure-render2d = { path = "crates/render2d" }
adventure-audio = { path = "crates/audio" }
adventure-input = { path = "crates/input" }
adventure-ui = { path = "crates/ui" }
adventure-scripting = { path = "crates/scripting" }
adventure-cutscene = { path = "crates/cutscene" }
adventure-localization = { path = "crates/localization" }
adventure-engine = { path = "crates/engine" }

# Foundation
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.2", features = ["serde"] }
string-interner = "0.14"
anyhow = "1"

[profile.dev]
opt-level = 1       # faster than 0 for development iteration; still debuggable

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
