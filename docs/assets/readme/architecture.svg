<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Ariadne crate architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f12"/>
      <stop offset="100%" stop-color="#141a1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#f0d78c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="url(#bg)"/>
  <text x="40" y="42" fill="#8aa4ad" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">ARIADNE · CRATE GRAPH</text>
  <text x="40" y="68" fill="#e8eef0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Host UI / MCP</text>
  <rect x="40" y="84" width="880" height="48" rx="10" fill="#1a2228" stroke="#2a3a42" filter="url(#soft)"/>
  <text x="480" y="114" text-anchor="middle" fill="#d7e2e6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">examples · scene viewer · Temporal / MCP</text>

  <!-- arrow -->
  <path d="M480 132 L480 158" stroke="url(#gold)" stroke-width="2"/>
  <polygon points="480,164 474,154 486,154" fill="#c9a227"/>

  <!-- mid row -->
  <rect x="40" y="170" width="430" height="120" rx="12" fill="#12181d" stroke="#c9a22755" filter="url(#soft)"/>
  <text x="60" y="200" fill="#f0d78c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">adventure-engine</text>
  <text x="60" y="228" fill="#a8b8bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">plant · walk_graph · retarget</text>
  <text x="60" y="248" fill="#a8b8bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">verbs · inventory · dialogue · save</text>
  <text x="60" y="268" fill="#6f858e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">crates/locomotion · inventory · audio · ui …</text>

  <rect x="490" y="170" width="430" height="120" rx="12" fill="#12181d" stroke="#2d8a8a66" filter="url(#soft)"/>
  <text x="510" y="200" fill="#7fd4d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">render2d + graph</text>
  <text x="510" y="228" fill="#a8b8bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">wgpu Slate batcher · 4 buses (kira)</text>
  <text x="510" y="248" fill="#a8b8bf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">ring-arc route planning · RON scenes</text>
  <text x="510" y="268" fill="#6f858e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">crates/render2d · graph · scene · scripting</text>

  <path d="M255 290 L255 318 M705 290 L705 318" stroke="#3a4a52" stroke-width="2"/>
  <path d="M255 318 L705 318" stroke="#3a4a52" stroke-width="2"/>
  <path d="M480 318 L480 340" stroke="url(#gold)" stroke-width="2"/>

  <rect x="240" y="340" width="480" height="56" rx="12" fill="#0f1418" stroke="#c9a22744"/>
  <text x="480" y="365" text-anchor="middle" fill="#e8eef0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Shared goldens · RON fixtures · walk plant math</text>
  <text x="480" y="384" text-anchor="middle" fill="#6f858e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">one behavioral contract · every host consumes the same numbers</text>
</svg>
